@keyframes ge0{0%,0%{stroke:#2A2A2A;fill:#141414}4%,18%{stroke:#E6E6E6;fill:#232323}22%,100%{stroke:#2A2A2A;fill:#141414}}.ge0{animation:ge0 10s ease infinite}@keyframes ge1{0%,20%{stroke:#2A2A2A;fill:#141414}24%,38%{stroke:#E6E6E6;fill:#232323}42%,100%{stroke:#2A2A2A;fill:#141414}}.ge1{animation:ge1 10s ease infinite}@keyframes ge2{0%,40%{stroke:#2A2A2A;fill:#141414}44%,58%{stroke:#E6E6E6;fill:#232323}62%,100%{stroke:#2A2A2A;fill:#141414}}.ge2{animation:ge2 10s ease infinite}@keyframes ge3{0%,60%{stroke:#2A2A2A;fill:#141414}64%,78%{stroke:#E6E6E6;fill:#232323}82%,100%{stroke:#2A2A2A;fill:#141414}}.ge3{animation:ge3 10s ease infinite}@keyframes ge4{0%,80%{stroke:#2A2A2A;fill:#141414}84%,98%{stroke:#E6E6E6;fill:#232323}100%,100%{stroke:#2A2A2A;fill:#141414}}.ge4{animation:ge4 10s ease infinite}</style>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#8A8A8A"/></linearGradient>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".09"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>

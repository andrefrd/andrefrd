<g class="up" style="animation-delay:0.30s"><rect class="ge2" x="1" y="121" width="418" height="50" rx="12" fill="#141414" stroke="#2A2A2A" stroke-width="1.4"/><text class="emo" x="36" y="154" text-anchor="middle" style="font-size:20px">🛠️</text><text class="gt" x="66" y="151" style="font-size:15px">Processo &gt; ferramenta</text></g>
<g class="up" style="animation-delay:0.40s"><rect class="ge3" x="1" y="181" width="418" height="50" rx="12" fill="#141414" stroke="#2A2A2A" stroke-width="1.4"/><text class="emo" x="36" y="214" text-anchor="middle" style="font-size:20px">🔁</text><text class="gt" x="66" y="211" style="font-size:15px">Recorrência &gt; bolada</text></g>
<g class="up" style="animation-delay:0.50s"><rect class="ge4" x="1" y="241" width="418" height="50" rx="12" fill="#141414" stroke="#2A2A2A" stroke-width="1.4"/><text class="emo" x="36" y="274" text-anchor="middle" style="font-size:20px">🙅</text><text class="gt" x="66" y="271" style="font-size:15px">Sem promessa milagrosa</text></g>
